<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - POS Webapp</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#00bcd4',
                        secondary: '#3f51b5',
                        background: '#212121',
                        surface: '#ffffff',
                        text: '#ffffff',
                        accent: '#ffffff',
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Roboto Slab', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                        'aurora-gradient': 'aurora 10s linear infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        aurora: {
                            '0%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                            '100%': { backgroundPosition: '0% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Add custom styles if needed, or rely on Tailwind */
        body {
            background-color: #212121; /* Dark background */
            color: #ffffff; /* White text */
            font-family: 'Montserrat', sans-serif;
        }
        .glassmorphism-input {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .glassmorphism-button {
            background: linear-gradient(90deg, #00bcd4, #3f51b5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease-out;
        }
        .glassmorphism-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.2);
        }
        .forgot-password-link {
            color: #00bcd4;
            text-decoration: none;
            transition: color 0.3s ease-out;
        }
        .forgot-password-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <!-- Header: Navigation (Simplified for Login Page) -->
    <header class="sticky top-0 z-50 py-4 px-6 bg-background/80 backdrop-blur-lg border-b border-white/20">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-bold font-serif text-surface hover:text-primary transition-colors">POS Pro</a>
            <nav class="hidden md:flex space-x-6">
                <a href="index.html" class="text-surface hover:text-primary transition-colors">Home</a>
                <a href="dashboard.html" class="text-surface hover:text-primary transition-colors">Dashboard</a>
                <a href="sales.html" class="text-surface hover:text-primary transition-colors">Sales</a>
                <a href="products.html" class="text-surface hover:text-primary transition-colors">Products</a>
                <a href="customers.html" class="text-surface hover:text-primary transition-colors">Customers</a>
                <a href="reports.html" class="text-surface hover:text-primary transition-colors">Reports</a>
                <a href="settings.html" class="text-surface hover:text-primary transition-colors">Settings</a>
            </nav>
            <button class="md:hidden text-surface hover:text-primary focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="flex items-center justify-center min-h-[calc(100vh-100px)] px-4 py-12">
        <div class="w-full max-w-md space-y-8 animate-fade-in-up">
            <div>
                <h2 class="mt-6 text-center text-3xl font-extrabold text-surface font-serif">
                    Welcome Back
                </h2>
                <p class="mt-2 text-center text-lg text-gray-300">
                    Log in to your professional POS dashboard.
                </p>
            </div>
            <form class="mt-8 space-y-6" action="#" method="POST">
                <div class="rounded-md shadow-none">
                    <div>
                        <label for="email-address" class="sr-only">Email address</label>
                        <input
                            id="email-address"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            class="relative block w-full px-4 py-3 border-0 rounded-lg glassmorphism-input placeholder-gray-400 text-surface focus:z-10 focus:ring-primary focus:border-primary sm:text-sm font-sans"
                            placeholder="Email address or Username"
                        />
                    </div>
                    <div class="mt-4">
                        <label for="password" class="sr-only">Password</label>
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="relative block w-full px-4 py-3 border-0 rounded-lg glassmorphism-input placeholder-gray-400 text-surface focus:z-10 focus:ring-primary focus:border-primary sm:text-sm font-sans"
                            placeholder="Password"
                        />
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input
                            id="remember-me"
                            name="remember-me"
                            type="checkbox"
                            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                        />
                        <label for="remember-me" class="ml-2 block text-sm text-surface">
                            Remember me
                        </label>
                    </div>

                    <div>
                        <a href="forgot-password.html" class="font-medium forgot-password-link text-sm">
                            Forgot your password?
                        </a>
                    </div>
                </div>

                <div>
                    <button
                        type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent rounded-lg text-lg font-medium text-surface glassmorphism-button focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary"
                    >
                        Login
                    </button>
                </div>
            </form>
            <p class="mt-8 text-center text-sm text-gray-400">
                Don't have an account?
                <a href="signup.html" class="font-medium text-primary hover:text-surface transition-colors">
                    Sign up
                </a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-background/80 backdrop-blur-lg border-t border-white/20 py-6 mt-12">
        <div class="container mx-auto px-6 text-center text-gray-400">
            <p>&copy; 2023 POS Pro. All rights reserved.</p>
            <div class="flex justify-center space-x-6 mt-4">
                <a href="#" class="hover:text-surface transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-surface transition-colors">Terms of Service</a>
                <a href="contact.html" class="hover:text-surface transition-colors">Contact Us</a>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
