<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <style>
         body {
            font-family: var(--font-primary);
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        :root {
            --color-bg: #121212;
            --color-primary: #64FFDA;
            --color-secondary: #F9F871;
            --color-text: #ffffff;
            --font-primary: 'Space Grotesk', sans-serif;
            --font-secondary: 'Roboto Mono', monospace;
        }

        header {
            background-color: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: clamp(0.5rem, 1vw, 1rem);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 3vw, 4rem);
        }

        nav a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--color-secondary);
        }

        main {
            padding: clamp(2rem, 5vw, 5rem);
        }

        section {
            margin-bottom: clamp(2rem, 5vw, 5rem);
        }

        h1, h2 {
            font-family: var(--font-primary);
            color: var(--color-primary);
            text-align: center;
            margin-bottom: clamp(1rem, 2vw, 2rem);
            font-size: clamp(2rem, 4vw, 4rem);
        }

        p {
            font-family: var(--font-primary);
            line-height: 1.6;
            margin-bottom: clamp(1rem, 2vw, 2rem);
            font-size: clamp(1rem, 1.5vw, 1.5rem);
        }

        form {
            max-width: 600px;
            margin: 0 auto;
            padding: clamp(1.5rem, 3vw, 3rem);
            background-color: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        label {
            display: block;
            margin-bottom: clamp(0.5rem, 1vw, 1rem);
            color: var(--color-text);
            font-size: clamp(1rem, 1.2vw, 1.2rem);
        }

        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: clamp(0.75rem, 1.5vw, 1.5rem);
            margin-bottom: clamp(1rem, 2vw, 2rem);
            border: 1px solid var(--color-primary);
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--color-text);
            border-radius: 5px;
            font-size: clamp(1rem, 1.2vw, 1.2rem);
            font-family: var(--font-primary);
            transition: border-color 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: var(--color-secondary);
            outline: none;
            box-shadow: 0 0 5px var(--color-secondary);
        }

        textarea {
            resize: vertical;
            height: 150px;
        }

        button {
            background-color: var(--color-primary);
            color: var(--color-bg);
            padding: clamp(0.75rem, 1.5vw, 1.5rem) clamp(1.5rem, 3vw, 3rem);
            border: none;
            border-radius: 5px;
            font-size: clamp(1rem, 1.2vw, 1.2rem);
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            font-family: var(--font-primary);
        }

        button:hover {
            background-color: var(--color-secondary);
            transform: translateY(-2px);
        }

        footer {
            background-color: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: clamp(1rem, 2vw, 2rem);
            text-align: center;
            color: var(--color-primary);
            font-size: clamp(0.75rem, 1vw, 1rem);
            box-shadow: 0 -4px 6px rgba(0, 0, 0, 0.1);
        }

        .contact-info {
            text-align: center;
            margin-top: clamp(2rem, 4vw, 4rem);
        }

        .contact-info a {
            color: var(--color-primary);
            text-decoration: none;
            margin: 0 clamp(0.5rem, 1vw, 1rem);
            font-size: clamp(1rem, 1.5vw, 1.5rem);
            transition: color 0.3s ease;
        }

        .contact-info a:hover {
            color: var(--color-secondary);
        }

        @keyframes reveal {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body, header, main, footer {
            animation: reveal 1s ease-out forwards;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact // Connection Established</h1>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </form>

            <div class="contact-info">
                <p>Or connect with me here:</p>
                <a href="mailto:your.email@example.com">Email</a>
                <a href="https://www.linkedin.com/in/yourprofile">LinkedIn</a>
                <a href="https://github.com/yourgithub">GitHub</a>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2024 [Your Name]
    </footer>

</body>
</html>
