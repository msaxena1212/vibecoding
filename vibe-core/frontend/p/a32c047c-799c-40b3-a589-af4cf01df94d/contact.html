<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SoloProtect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }

        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }

        @keyframes fade-in-up {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            100: '#E9F5F2',
                            200: '#A2D9CE',
                            300: '#52BE80',
                        },
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif'],
                        serif: ['Poppins', 'serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-primary-100">
    <div class="container mx-auto px-4 py-12">
        <header class="mb-8">
            <h1 class="text-3xl font-serif font-semibold text-center text-gray-800">Contact Us</h1>
            <p class="text-center text-gray-600 mt-2">We'd love to hear from you. Please use the form below to get in touch.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-6 shadow-lg animate-fade-in-up">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Send us a message</h2>
                <form action="#" method="POST">
                    <div class="mb-4">
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                        <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Name">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Email">
                    </div>
                    <div class="mb-6">
                        <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message</label>
                        <textarea id="message" name="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Message"></textarea>
                    </div>
                    <button type="submit" class="bg-primary-200 hover:bg-primary-300 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 ring-primary transition-colors duration-300">Send Message</button>
                </form>
            </div>

            <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-6 shadow-lg animate-fade-in-up">
                <h2 class="text-xl font-semibold mb-4 text-gray-800">Contact Information</h2>
                <ul class="list-none pl-0">
                    <li class="mb-2">
                        <strong class="font-medium text-gray-700">Email:</strong>
                        <a href="mailto:support@soloprotect.com" class="text-primary-300 hover:underline">support@soloprotect.com</a>
                    </li>
                    <li class="mb-2">
                        <strong class="font-medium text-gray-700">Phone:</strong>
                        +1-555-123-4567
                    </li>
                    <li>
                        <strong class="font-medium text-gray-700">Address:</strong>
                        123 Tranquility Lane, Sereneville
                    </li>
                </ul>

                <div class="mt-6">
                    <h3 class="text-lg font-semibold mb-2 text-gray-800">Our Location</h3>
                    <div class="rounded-2xl overflow-hidden">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2483.624445952384!2d-0.1277583!3d51.5073509!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x48761caf6969c2e1%3A0x4291f317240ea2d3!2sHyde%20Park!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus"
                            width="100%" height="200" style="border:0;" allowfullscreen="" loading="lazy"
                            referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
