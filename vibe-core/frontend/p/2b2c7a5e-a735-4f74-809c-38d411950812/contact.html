<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Photography Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: var(--font-body);
            background-color: var(--color-bg);
            color: var(--color-text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        :root {
            --color-bg: #FFFFFF;
            --color-text: #1A1A1A;
            --color-accent: #737373;
            --font-heading: 'Lora', serif;
            --font-body: 'Open Sans', sans-serif;
        }

        header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: clamp(1rem, 2vw, 2rem);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 3vw, 4rem);
        }

        nav a {
            color: var(--color-text);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: var(--color-accent);
        }

        main {
            padding: clamp(2rem, 5vw, 5rem);
            max-width: 1200px;
            margin: 0 auto;
        }

        section {
            margin-bottom: clamp(3rem, 6vw, 6rem);
        }

        h1, h2 {
            font-family: var(--font-heading);
            color: var(--color-text);
            margin-bottom: clamp(0.5rem, 1vw, 1rem);
            text-align: center;
        }

        .contact-form {
            display: grid;
            gap: clamp(1rem, 2vw, 2rem);
            max-width: 600px;
            margin: 0 auto;
        }

        .contact-form label {
            display: block;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--color-accent);
            border-radius: 5px;
            font-family: var(--font-body);
            font-size: 1rem;
            resize: vertical;
        }

        .contact-form button {
            background-color: var(--color-text);
            color: var(--color-bg);
            padding: 1rem 2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: background-color 0.3s ease;
        }

        .contact-form button:hover {
            background-color: var(--color-accent);
        }

        .map-container {
            width: 100%;
            height: 400px;
            border: 1px solid var(--color-accent);
            border-radius: 5px;
            overflow: hidden;
            margin-top: clamp(2rem, 4vw, 4rem);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        footer {
            background-color: var(--color-text);
            color: var(--color-bg);
            text-align: center;
            padding: clamp(1rem, 2vw, 2rem);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--color-bg);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h1>Contact Me</h1>
            <p>I'd love to hear from you! Please fill out the form below to get in touch.</p>

            <form class="contact-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>

            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d24209.078249886888!2d-73.9851303!3d40.758895!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c258e4a1c56747%3A0x25ced39f075854a0!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1720403691883!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>

    <footer>
        &copy; 2024 Photography Portfolio | <a href="#">Privacy Policy</a>
    </footer>

</body>
</html>
