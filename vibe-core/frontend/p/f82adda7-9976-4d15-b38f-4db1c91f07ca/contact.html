<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Sleep Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#E8EFFF',
                            100: '#D1DDFE',
                            200: '#BBD0FD',
                            300: '#A4C2FC',
                            400: '#8DAFFB',
                            500: '#769DFB',
                            600: '#5E8BF9',
                            700: '#4678F8',
                            800: '#2E66F7',
                            900: '#1654F6',
                        },
                        secondary: {
                            50: '#F0E7FF',
                            100: '#E0D1FE',
                            200: '#CBB2FD',
                            300: '#B794FC',
                            400: '#A376FB',
                            500: '#8F58FA',
                            600: '#7B3AF9',
                            700: '#671CF8',
                            800: '#5300F7',
                            900: '#3F00F6',
                        },
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gradient-to-br from-primary-50 to-secondary-50">

    <header class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-lg py-4 px-6 mx-auto max-w-5xl mt-6">
        <nav class="flex items-center justify-between">
            <a href="index.html" class="text-xl font-bold text-primary-800">Sleep Tracker</a>
            <ul class="flex space-x-6">
                <li><a href="index.html" class="hover:text-primary-600 transition-colors duration-200">Home</a></li>
                <li><a href="about.html" class="hover:text-primary-600 transition-colors duration-200">About</a></li>
                <li><a href="contact.html" class="hover:text-primary-600 transition-colors duration-200">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container mx-auto py-12 px-6 max-w-3xl">
        <section class="mb-12 text-center">
            <h1 class="text-4xl font-bold text-primary-800 mb-4">Get in Touch</h1>
            <p class="text-gray-700">We're here to help! Contact us with any questions or feedback.</p>
        </section>

        <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-lg p-8 mb-8">
            <form>
                <div class="mb-4">
                    <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                    <input type="text" id="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Name">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Email">
                </div>
                <div class="mb-4">
                    <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message</label>
                    <textarea id="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" placeholder="Your Message"></textarea>
                </div>
                <div class="flex items-center justify-between">
                    <button class="bg-primary-500 hover:bg-primary-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 ring-primary" type="submit">
                        Send Message
                    </button>
                </div>
            </form>
        </div>

        <section class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-primary-800 mb-4">Contact Information</h2>
            <p class="text-gray-700 mb-2">Email: support@sleeptracker.com</p>
            <p class="text-gray-700 mb-4">Phone: (555) 123-4567</p>

            <div class="flex space-x-4">
                <a href="#" class="text-primary-500 hover:text-primary-700">Facebook</a>
                <a href="#" class="text-primary-500 hover:text-primary-700">Twitter</a>
                <a href="#" class="text-primary-500 hover:text-primary-700">LinkedIn</a>
            </div>
        </section>
    </main>

    <footer class="text-center py-6 text-gray-600">
        <p>&copy; 2024 Sleep Tracker. All rights reserved.</p>
    </footer>

</body>
</html>
