<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Roboto', 'serif'],
                    },
                    colors: {
                        primary: '#1E293B',
                        secondary: '#FFFFFF',
                        accent: '#3B82F6',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
      body {
        font-family: 'Roboto', sans-serif;
      }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <a href="index.html" class="text-xl font-semibold text-primary">Your AI Tool</a>
                <div class="space-x-6">
                    <a href="index.html" class="text-gray-700 hover:text-primary">Home</a>
                    <a href="about.html" class="text-gray-700 hover:text-primary">About</a>
                    <a href="contact.html" class="text-gray-700 hover:text-primary">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="container mx-auto mt-12 p-8 bg-white shadow-lg rounded-2xl">
        <h1 class="text-3xl font-semibold text-primary mb-6">Contact Us</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <form id="contactForm" class="space-y-4">
                    <div>
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name:</label>
                        <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent">
                    </div>
                    <div>
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                        <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent">
                    </div>
                    <div>
                        <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message:</label>
                        <textarea id="message" name="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent"></textarea>
                    </div>
                    <div>
                        <button type="submit" class="bg-accent hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent">
                            Submit
                        </button>
                    </div>
                </form>
            </div>

            <div>
                <h2 class="text-2xl font-semibold text-primary mb-4">Contact Information</h2>
                <p class="text-gray-700">Address: 123 Main Street, Anytown, CA 12345</p>
                <p class="text-gray-700">Phone: (123) 456-7890</p>
                <p class="text-gray-700">Email: info@example.com</p>

                <div class="mt-6">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.774481140335!2d-122.41945!3d37.774929!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80858083a4978969%3A0x47f2c67a5a956f8c!2sGolden%20Gate%20Bridge!5e0!3m2!1sen!2sus!4v1701897571889!5m2!1sen!2sus"
                        width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="rounded-2xl"></iframe>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-primary text-white py-6 mt-12">
        <div class="container mx-auto text-center">
            <p>&copy; 2023 Your AI Tool. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const message = document.getElementById('message').value;

            if (!name || !email || !message) {
                alert('Please fill out all fields.');
                return;
            }

            // Simulate form submission to a backend service
            setTimeout(() => {
                alert('Form submitted successfully!');
                document.getElementById('contactForm').reset();
            }, 500);
        });
    </script>
</body>
</html>
