<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - AI Insights</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3498db',
                        secondary: '#2ecc71',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        body: ['Open Sans', 'sans-serif'],
                    },
                    spacing: {
                        'fluid-1': 'calc(1rem + 2vw)',
                        'fluid-2': 'calc(2rem + 4vw)',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-body">

    <!-- Navigation -->
    <nav class="bg-white shadow-md">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="index.html" class="text-2xl font-semibold text-primary">AI Insights</a>
                <div class="space-x-6">
                    <a href="index.html" class="hover:text-primary transition-colors">Home</a>
                    <a href="about.html" class="hover:text-primary transition-colors">About</a>
                    <a href="contact.html" class="hover:text-primary transition-colors">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="container mx-auto mt-12 p-6 bg-white rounded-lg shadow-md">
        <h2 class="text-3xl font-semibold text-gray-800 mb-6">Contact Us</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- Contact Form -->
            <div>
                <form action="#" method="POST">
                    <div class="mb-4">
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                        <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                        <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary">
                    </div>
                    <div class="mb-4">
                        <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message</label>
                        <textarea id="message" name="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary"></textarea>
                    </div>
                    <button type="submit" class="bg-primary hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 ring-primary">
                        Send Message
                    </button>
                </form>
            </div>

            <!-- Contact Information & Map -->
            <div>
                <h3 class="text-xl font-semibold text-gray-700 mb-4">Contact Information</h3>
                <p class="text-gray-600 mb-2">Address: 123 AI Insights Street, Anytown, USA</p>
                <p class="text-gray-600 mb-2">Phone: (555) 123-4567</p>
                <p class="text-gray-600 mb-4">Email: info@aiinsights.com</p>

                <!-- Replace with your actual map embed code -->
                <div class="h-48 bg-gray-200 rounded-lg">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3963.9494793865074!2d-73.9857083852934!3d40.75889587957736!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c258e477d38547%3A0x595e049248939c79!2sTimes%20Square!5e0!3m2!1sen!2sus!4v1680786104827!5m2!1sen!2sus" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-200 py-4 mt-12">
        <div class="container mx-auto text-center text-gray-600">
            &copy; 2023 AI Insights. All rights reserved.
        </div>
    </footer>

</body>
</html>
