<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .animate-fade-in-up {
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .reveal {
            position: relative;
            transform: translateY(150px);
            opacity: 0;
            transition: 1s all ease;
        }

        .reveal.active {
            transform: translateY(0);
            opacity: 1;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#E0F7FA',
                            100: '#B2EBF2',
                            200: '#80DEEA',
                            300: '#4DD0E1',
                            400: '#26C6DA',
                            500: '#00BCD4',
                            600: '#00ACC1',
                            700: '#0097A7',
                            800: '#00838F',
                            900: '#006064',
                        },
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50">

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="font-bold text-xl text-primary-700">SecureChat</a>
            <nav class="hidden md:flex space-x-4">
                <a href="index.html" class="hover:text-primary-500">Home</a>
                <a href="chat.html" class="hover:text-primary-500">Chat</a>
                <a href="profile.html" class="hover:text-primary-500">Profile</a>
                <a href="settings.html" class="hover:text-primary-500">Settings</a>
            </nav>
            <button id="mobile-menu-button" class="md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </div>
    </header>

    <!-- Mobile Menu (Hidden by default) -->
    <div id="mobile-menu" class="hidden fixed top-0 left-0 w-full h-full bg-white/10 backdrop-blur-lg z-40">
        <div class="flex flex-col items-center justify-center h-full">
            <a href="index.html" class="py-2 px-4 text-lg hover:text-primary-500">Home</a>
            <a href="chat.html" class="py-2 px-4 text-lg hover:text-primary-500">Chat</a>
            <a href="profile.html" class="py-2 px-4 text-lg hover:text-primary-500">Profile</a>
            <a href="settings.html" class="py-2 px-4 text-lg hover:text-primary-500">Settings</a>
            <button id="close-menu-button" class="absolute top-4 right-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
    </div>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <section class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">App Settings</h1>
            <p class="text-gray-600">Customize your app experience and manage your preferences.</p>
        </section>

        <!-- Settings Sections -->
        <section class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-3">Notifications</h2>
            <div class="bg-white shadow rounded-lg p-4">
                <div class="flex items-center justify-between py-2 border-b border-gray-200">
                    <label class="text-gray-700">Enable Notifications</label>
                    <input type="checkbox" class="form-checkbox h-5 w-5 text-primary-500 rounded focus:ring-primary-500">
                </div>
                <div class="flex items-center justify-between py-2 border-b border-gray-200">
                    <label class="text-gray-700">Notification Sound</label>
                    <select class="form-select rounded-md shadow-sm focus:ring-primary-500">
                        <option>Default</option>
                        <option>Chime</option>
                        <option>Bell</option>
                    </select>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label class="text-gray-700">Vibrate</label>
                    <input type="checkbox" class="form-checkbox h-5 w-5 text-primary-500 rounded focus:ring-primary-500">
                </div>
            </div>
        </section>

        <section class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-3">Privacy</h2>
            <div class="bg-white shadow rounded-lg p-4">
                <div class="flex items-center justify-between py-2 border-b border-gray-200">
                    <label class="text-gray-700">End-to-End Encryption</label>
                    <span class="text-green-500">Enabled</span>
                </div>
                <div class="flex items-center justify-between py-2 border-b border-gray-200">
                    <label class="text-gray-700">Disappearing Messages</label>
                    <select class="form-select rounded-md shadow-sm focus:ring-primary-500">
                        <option>Off</option>
                        <option>1 Hour</option>
                        <option>1 Day</option>
                        <option>1 Week</option>
                    </select>
                </div>
                <div class="flex items-center justify-between py-2">
                    <label class="text-gray-700">Blocked Contacts</label>
                    <a href="#" class="text-primary-500 hover:text-primary-700">Manage</a>
                </div>
            </div>
        </section>

        <section class="mb-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-3">Security</h2>
            <div class="bg-white shadow rounded-lg p-4">
                <div class="flex items-center justify-between py-2 border-b border-gray-200">
                    <label class="text-gray-700">Two-Factor Authentication</label>
                    <input type="checkbox" class="form-checkbox h-5 w-5 text-primary-500 rounded focus:ring-primary-500">
                </div>
                <div class="flex items-center justify-between py-2">
                    <label class="text-gray-700">Change Password</label>
                    <a href="#" class="text-primary-500 hover:text-primary-700">Update</a>
                </div>
            </div>
        </section>

        <!-- Back to Top Button -->
        <button id="back-to-top" class="hidden fixed bottom-4 right-4 bg-primary-500 text-white rounded-full p-2 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
            </svg>
        </button>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-100 py-4 text-center">
        <p class="text-gray-500">© 2024 SecureChat. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            const closeMenuButton = document.getElementById('close-menu-button');
            const backToTopButton = document.getElementById('back-to-top');

            mobileMenuButton.addEventListener('click', function() {
                mobileMenu.classList.remove('hidden');
            });

            closeMenuButton.addEventListener('click', function() {
                mobileMenu.classList.add('hidden');
            });

            // Back to top button functionality
            window.addEventListener('scroll', () => {
                if (document.documentElement.scrollTop > 1000) {
                    backToTopButton.classList.remove('hidden');
                } else {
                    backToTopButton.classList.add('hidden');
                }
            });

            backToTopButton.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        });
    </script>
</body>
</html>
