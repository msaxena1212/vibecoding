        // Mobile menu toggle
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const closeMenuButton = document.getElementById('close-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');

        mobileMenuButton.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });

        closeMenuButton.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
        });

        // Back to Top button logic
        const backToTopButton = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 500) { // Show button after scrolling 500px
                backToTopButton.classList.remove('hidden');
            } else {
                backToTopButton.classList.add('hidden');
            }
        });

        backToTopButton.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });

        // Reveal on Scroll initialization
        const revealElements = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                    observer.unobserve(entry.target); // Optional: unobserve after activation
                }
            });
        }, { threshold: 0.1 }); // Trigger when 10% of the element is visible

        revealElements.forEach(el => {
            observer.observe(el);
        });

        // Add custom button styles
        const style = document.createElement('style');
        style.innerHTML = `
            .btn-primary {
                @apply bg-yellow-500 text-black font-lucky py-3 px-6 rounded-full shadow-lg transform hover:scale-105 hover:bg-yellow-400 transition-all duration-300 ease-out focus:outline-none focus:ring-2 focus:ring-yellow-300;

                @apply bg-transparent text-white border-2 border-yellow-500 font-lucky py-3 px-6 rounded-full shadow-lg transform hover:scale-105 hover:bg-yellow-500 hover:text-black transition-all duration-300 ease-out focus:outline-none focus:ring-2 focus:ring-yellow-300;
            }
            .glassmorphism-3\.0 {
                background: rgba(255, 255, 255, 0.1);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.2);
            }
        `;
        document.head.appendChild(style);
