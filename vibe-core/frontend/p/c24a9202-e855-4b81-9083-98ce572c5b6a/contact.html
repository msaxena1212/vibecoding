<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@400;500&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            100: '#E0E7FF',
                            400: '#A5B4FC',
                        },
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        body: ['Open Sans', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    <style>
        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-100 font-body">
    <nav class="bg-white shadow">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <a href="index.html" class="text-2xl font-semibold text-gray-800">Guardian Angel</a>
                <div class="space-x-6">
                    <a href="about.html" class="text-gray-600 hover:text-gray-800">About</a>
                    <a href="contact.html" class="text-gray-600 hover:text-gray-800">Contact</a>
                </div>
            </div>
        </div>
    </nav>

    <section class="py-20">
        <div class="container mx-auto px-4">
            <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl p-8 animate-fade-in-up">
                <h2 class="text-3xl font-semibold text-gray-800 mb-6 text-center">Contact Us</h2>

                <form action="#" method="POST" class="space-y-4">
                    <div>
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name:</label>
                        <input type="text" id="name" name="name"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary-400">
                    </div>

                    <div>
                        <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                        <input type="email" id="email" name="email"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary-400">
                    </div>

                    <div>
                        <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message:</label>
                        <textarea id="message" name="message" rows="4"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-primary-400"></textarea>
                    </div>

                    <div class="flex items-center justify-between">
                        <button
                            class="bg-primary-400 hover:bg-primary-100 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 ring-primary-400"
                            type="submit">
                            Send Message
                        </button>
                    </div>
                </form>

                <div class="mt-8 border-t pt-8">
                    <p class="text-gray-600">Alternatively, you can reach us directly:</p>
                    <p class="text-gray-800 font-semibold mt-2">Email: support@guardianangel.com</p>
                    <p class="text-gray-800 font-semibold">Phone: +1-555-123-4567</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-gray-200 py-4 text-center">
        <p class="text-gray-600">© 2024 Guardian Angel. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
