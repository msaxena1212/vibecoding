[project]
name = "vibe-langgraph"
version = "0.1.0"
description = "AI-powered coding platform using LangGraph"
authors = [{name = "Antigravity", email = "antigravity@example.com"}]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "langgraph>=0.0.10",
    "langchain>=0.1.0",
    "langchain-google-genai>=0.0.9",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "jinja2>=3.1.0",
    "black>=24.1.0",
    "sqlmodel>=0.0.14",
    "asyncpg>=0.29.0",
    "supabase>=2.3.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "agents", "graph", "memory", "utils", "configs"]
