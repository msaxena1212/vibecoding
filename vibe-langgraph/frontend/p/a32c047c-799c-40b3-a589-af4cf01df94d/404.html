<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Open+Sans:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                        serif: ['Open Sans', 'serif'],
                    },
                    colors: {
                        primary: {
                            100: '#E9F5F2',
                            200: '#A2D9CE',
                            300: '#52BE80',
                        },
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, #E9F5F2, #A2D9CE);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-primary-100 to-primary-200">
    <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-8 text-center shadow-lg">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Oops! Page Not Found</h1>
        <p class="text-gray-600 mb-6">We couldn't find the page you were looking for. It might have been moved or deleted.</p>
        <div class="flex justify-center space-x-4">
            <a href="index.html" class="bg-primary-200 hover:bg-primary-300 text-white font-semibold py-2 px-4 rounded-xl transition-colors duration-300 focus:ring-2 ring-primary-300">Go Home</a>
            <a href="contact.html" class="text-primary-300 hover:text-primary-200 font-semibold py-2 px-4 rounded-xl transition-colors duration-300 focus:ring-2 ring-primary-300">Contact Us</a>
        </div>
        <p class="mt-8 text-sm text-gray-500">Error 404 - SoloProtect</p>
    </div>
</body>
</html>
