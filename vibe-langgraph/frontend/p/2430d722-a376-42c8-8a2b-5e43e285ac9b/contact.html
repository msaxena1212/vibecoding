<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Chai Sutta Bar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
        }
        h1, h2, h3 {
            font-family: 'Roboto Slab', serif;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#A0522D',
                        secondary: '#F5F5DC',
                        white: '#FFFFFF',
                    },
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif'],
                        serif: ['Roboto Slab', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-secondary text-primary">

    <!-- Header -->
    <header class="bg-white/10 backdrop-blur-lg border border-white/20 p-4">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-xl font-bold">Chai Sutta Bar</a>
            <nav>
                <ul class="flex space-x-4">
                    <li><a href="index.html" class="hover:text-white transition-colors">Home</a></li>
                    <li><a href="about.html" class="hover:text-white transition-colors">About</a></li>
                    <li><a href="menu.html" class="hover:text-white transition-colors">Menu</a></li>
                    <li><a href="locations.html" class="hover:text-white transition-colors">Locations</a></li>
                    <li><a href="contact.html" class="hover:text-white transition-colors">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contact Form -->
    <section class="container mx-auto my-12 p-8 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl">
        <h1 class="text-3xl font-serif font-bold mb-6 text-center">Get in Touch</h1>
        <form class="max-w-lg mx-auto">
            <div class="mb-4">
                <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name:</label>
                <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Your Name">
            </div>
            <div class="mb-4">
                <label for="email" class="block text-gray-700 text-sm font-bold mb-2">Email:</label>
                <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Your Email">
            </div>
            <div class="mb-4">
                <label for="message" class="block text-gray-700 text-sm font-bold mb-2">Message:</label>
                <textarea id="message" name="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="Your Message"></textarea>
            </div>
            <div class="flex items-center justify-between">
                <button class="bg-primary hover:bg-brown-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline" type="submit">
                    Send Message
                </button>
            </div>
        </form>
    </section>

    <!-- Contact Information -->
    <section class="container mx-auto my-12 p-8 bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl">
        <h2 class="text-2xl font-serif font-bold mb-4 text-center">Contact Information</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <h3 class="font-bold">Address</h3>
                <p>123 Chai Sutta Street</p>
                <p>City, State, Zip Code</p>
            </div>
            <div>
                <h3 class="font-bold">Phone</h3>
                <p>+1 (555) 123-4567</p>
            </div>
            <div>
                <h3 class="font-bold">Email</h3>
                <p>info@chaisuttabar.com</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white/10 backdrop-blur-lg border border-white/20 p-4 text-center">
        <p>&copy; 2024 Chai Sutta Bar. All rights reserved.</p>
    </footer>

</body>
</html>
