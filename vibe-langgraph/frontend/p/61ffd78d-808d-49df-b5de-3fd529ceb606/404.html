<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        body: ['Open Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: '#3498db',
                        secondary: '#2ecc71',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
    <div class="bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-lg p-8 text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-4">Oops! Page Not Found</h1>
        <p class="text-gray-600 mb-6">We're sorry, but the page you were looking for could not be found. It might have been moved, renamed, or does not exist.</p>
        <div class="flex items-center justify-center space-x-4">
            <a href="index.html" class="bg-primary hover:bg-blue-600 text-white font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-primary transition-colors duration-300">Go Home</a>
            <a href="contact.html" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded focus:outline-none focus:ring-2 focus:ring-primary transition-colors duration-300">Contact Us</a>
        </div>
    </div>
</body>
</html>
