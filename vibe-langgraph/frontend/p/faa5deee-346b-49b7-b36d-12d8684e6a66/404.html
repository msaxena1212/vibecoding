<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: '#1E293B',
                        secondary: '#FFFFFF',
                        accent: '#3B82F6',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1E293B;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="bg-primary flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-6xl font-serif font-bold mb-4">404</h1>
        <p class="text-lg mb-8">Oops! It seems like you've stumbled upon a page that doesn't exist.</p>
        <a href="index.html" class="bg-accent text-white py-3 px-6 rounded-xl hover:bg-blue-600 transition-colors duration-300 focus:ring-2 ring-blue-500">
            Take me back home
        </a>
    </div>
</body>
</html>
