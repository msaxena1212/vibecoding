<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <script src="script.js" defer></script>
    <style>
        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
        }

        header, footer {
            background-color: var(--color-primary-light);
            color: var(--color-primary-dark);
            padding: clamp(1rem, 3vw, 2rem);
            text-align: center;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            gap: clamp(1rem, 2vw, 2rem);
        }

        nav a {
            color: var(--color-primary-dark);
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: var(--color-accent);
            color: var(--color-bg);
        }

        main {
            padding: clamp(1rem, 5vw, 3rem);
        }

        section {
            margin-bottom: clamp(2rem, 5vw, 4rem);
        }

        h1, h2 {
            font-family: var(--font-headline);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* Contact Form Styles */
        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            background-color: rgba(255, 255, 255, 0.1);
            padding: clamp(1rem, 3vw, 2rem);
            border-radius: 1rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .contact-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 0.25rem;
            box-sizing: border-box;
            font-family: var(--font-body);
        }

        .contact-form textarea {
            height: 150px;
        }

        .contact-form button {
            background-color: var(--color-accent);
            color: var(--color-bg);
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.25rem;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s ease;
        }

        .contact-form button:hover {
            background-color: var(--color-primary-dark);
        }

        /* Contact Information Styles */
        .contact-info {
            margin-top: clamp(2rem, 4vw, 3rem);
            text-align: center;
        }

        .contact-info h2 {
            margin-bottom: 1.5rem;
        }

        .contact-details p {
            margin-bottom: 0.75rem;
        }

        /* Map Styles */
        .map-container {
            margin-top: clamp(2rem, 4vw, 3rem);
        }

        .map-container iframe {
            width: 100%;
            height: 300px;
            border: 0;
        }

        /* Accessibility Improvements */
        input:focus,
        textarea:focus {
            outline: 2px solid var(--color-accent);
            box-shadow: 0 0 5px var(--color-accent);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-container">
            <h1>Let's Connect</h1>
            <form class="contact-form">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>

            <div class="contact-info">
                <h2>Contact Information</h2>
                <div class="contact-details">
                    <p><strong>Address:</strong> 123 Main Street, Anytown USA</p>
                    <p><strong>Phone:</strong> (123) 456-7890</p>
                    <p><strong>Email:</strong> info@example.com</p>
                </div>
            </div>

            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3023.5790804932704!2d-73.99617378457772!3d40.73086467932846!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c259a9b311d3dd%3A0xf47a2fa065eb2991!2sFlatiron%20Building!5e0!3m2!1sen!2sus!4v1680798372567!5m2!1sen!2sus" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 My Simple Website</p>
    </footer>
</body>
</html>
