<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .animate-fade-in-up {
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .reveal {
            position: relative;
            transform: translateY(150px);
            opacity: 0;
            transition: 1s all ease;
        }

        .reveal.active {
          transform: translateY(0);
          opacity: 1;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#EFFFF4',
                            100: '#DFFFF0',
                            200: '#BFFFF7',
                            300: '#9FFFF0',
                            400: '#7FFFEA',
                            500: '#25D366',
                            600: '#128C7E',
                            700: '#0A6156',
                            800: '#074B42',
                            900: '#053A32',
                        },
                    },
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100">
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="text-2xl font-bold text-primary-600">SecureChat</a>
            <button id="mobile-menu-button" class="md:hidden">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            <div class="hidden md:flex items-center space-x-6">
                <a href="index.html" class="hover:text-primary-500 transition-colors duration-200">Home</a>
                <a href="chat.html" class="hover:text-primary-500 transition-colors duration-200">Chat</a>
                <a href="profile.html" class="hover:text-primary-500 transition-colors duration-200">Profile</a>
            </div>
        </nav>

        <!-- Mobile Menu (Hidden by default) -->
        <div id="mobile-menu" class="hidden bg-white/10 backdrop-blur-lg absolute top-full left-0 w-full py-4 shadow-md">
            <div class="container mx-auto px-4">
                <a href="index.html" class="block py-2 hover:bg-gray-100 transition-colors duration-200">Home</a>
                <a href="chat.html" class="block py-2 hover:bg-gray-100 transition-colors duration-200">Chat</a>
                <a href="profile.html" class="block py-2 hover:bg-gray-100 transition-colors duration-200">Profile</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto mt-8 p-4">
        <section class="mb-8 text-center">
            <h1 class="text-3xl font-semibold text-gray-800">Your Profile</h1>
            <p class="text-gray-600">Manage your profile information and settings.</p>
        </section>

        <div class="reveal bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl shadow-lg p-6 max-w-md mx-auto">
            <div class="flex flex-col items-center">
                <img src="assets/alice.jpg" alt="Profile Picture" class="w-32 h-32 rounded-full object-cover mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Alice Wonderland</h2>
                <p class="text-gray-500 mb-2">Status: Available</p>
            </div>

            <div class="mt-4">
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Update Profile Information</h3>
                <form>
                    <div class="mb-4">
                        <label for="name" class="block text-gray-700 text-sm font-bold mb-2">Name:</label>
                        <input type="text" id="name" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" value="Alice Wonderland">
                    </div>
                    <div class="mb-4">
                        <label for="status" class="block text-gray-700 text-sm font-bold mb-2">Status:</label>
                        <input type="text" id="status" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" value="Available">
                    </div>
                    <button class="bg-primary-500 hover:bg-primary-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline">
                        Update Profile
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-white shadow-md py-4 mt-8">
        <div class="container mx-auto text-center">
            <p class="text-gray-500">© 2024 SecureChat. All rights reserved.</p>
        </div>
    </footer>

    <button id="back-to-top" class="hidden fixed bottom-4 right-4 bg-primary-500 text-white rounded-full p-2 hover:bg-primary-700 focus:outline-none focus:ring-2 ring-primary">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="h-6 w-6">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
    </button>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Mobile Menu Toggle
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');

            mobileMenuButton.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });

            // Back to Top Button
            const backToTopButton = document.getElementById('back-to-top');

            window.addEventListener('scroll', function() {
                if (window.pageYOffset > 1000) {
                    backToTopButton.classList.remove('hidden');
                } else {
                    backToTopButton.classList.add('hidden');
                }
            });

            backToTopButton.addEventListener('click', function(e) {
                e.preventDefault();
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });

              function reveal() {
                var reveals = document.querySelectorAll(".reveal");
                for (var i = 0; i < reveals.length; i++) {
                  var windowHeight = window.innerHeight;
                  var elementTop = reveals[i].getBoundingClientRect().top;
                  var elementVisible = 150;

                  if (elementTop < windowHeight - elementVisible) {
                    reveals[i].classList.add("active");
                  } else {
                    reveals[i].classList.remove("active");
                  }
                }
              }

              window.addEventListener("scroll", reveal);

        });
    </script>
</body>
</html>
