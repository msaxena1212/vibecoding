<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Roboto Mono', 'monospace'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#1E1E1E',
                            light: '#FFFFFF',
                            accent: '#64FFDA',
                        }
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1E1E1E;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="bg-primary">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-3xl shadow-lg p-8 md:p-12 max-w-2xl w-full text-center">
            <h1 class="text-5xl font-bold text-primary-accent mb-4 animate-fade-in-up">404</h1>
            <p class="text-lg mb-6 animate-fade-in-up">Oops! The page you're looking for could not be found.</p>
            <div class="space-x-4 animate-fade-in-up">
                <a href="index.html" class="bg-primary-accent text-primary font-semibold py-2 px-6 rounded-full hover:bg-primary-accent/80 transition-colors duration-300 focus:ring-2 ring-primary-accent">
                    Go to Homepage
                </a>
                <a href="contact.html" class="text-primary-accent hover:text-primary-accent/80 transition-colors duration-300 focus:ring-2 ring-primary-accent">
                    Contact Us
                </a>
            </div>
        </div>
    </div>
</body>
</html>
