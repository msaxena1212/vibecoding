<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Nova Horizon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Open Sans', 'sans-serif'],
                        serif: ['Roboto Slab', 'serif'],
                    },
                    colors: {
                        'primary': '#000000',
                        'secondary': '#1A237E',
                        'accent': '#4A148C',
                        'gold': '#D4AC0D',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0D1117;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="font-sans">

    <header class="bg-black/70 backdrop-blur-lg py-4 px-6 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-serif font-bold text-gold">Nova Horizon</a>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="hover:text-gold transition-colors duration-200">Home</a></li>
                    <li><a href="about.html" class="hover:text-gold transition-colors duration-200">About</a></li>
                    <li><a href="contact.html" class="text-gold">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="container mx-auto py-16 px-6">
        <h1 class="text-4xl font-serif font-bold mb-8 text-center">Contact Us</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <form class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 border border-white/20">
                    <div class="mb-4">
                        <label for="name" class="block text-sm font-bold mb-2">Name</label>
                        <input type="text" id="name" name="name" class="shadow appearance-none border rounded w-full py-2 px-3 leading-tight focus:outline-none focus:shadow-outline bg-black/20 border-white/10 text-white" placeholder="Your Name">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-sm font-bold mb-2">Email</label>
                        <input type="email" id="email" name="email" class="shadow appearance-none border rounded w-full py-2 px-3 leading-tight focus:outline-none focus:shadow-outline bg-black/20 border-white/10 text-white" placeholder="Your Email">
                    </div>
                    <div class="mb-4">
                        <label for="message" class="block text-sm font-bold mb-2">Message</label>
                        <textarea id="message" name="message" rows="4" class="shadow appearance-none border rounded w-full py-2 px-3 leading-tight focus:outline-none focus:shadow-outline bg-black/20 border-white/10 text-white" placeholder="Your Message"></textarea>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-gold hover:bg-yellow-500 text-black font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors duration-200" type="submit">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>

            <div>
                <h2 class="text-2xl font-serif font-bold mb-4">Contact Information</h2>
                <p class="mb-2"><strong>Address:</strong> 123 Galaxy Way, Suite 42, Cosmic City, CA 90210</p>
                <p class="mb-2"><strong>Phone:</strong> (555) 123-4567</p>
                <p class="mb-2"><strong>Email:</strong> info@novahorizon.com</p>

                <div class="mt-6">
                    <h3 class="text-lg font-bold mb-2">Follow Us</h3>
                    <div class="flex space-x-4">
                        <a href="#" class="hover:text-gold transition-colors duration-200">Facebook</a>
                        <a href="#" class="hover:text-gold transition-colors duration-200">Twitter</a>
                        <a href="#" class="hover:text-gold transition-colors duration-200">Instagram</a>
                    </div>
                </div>

                <div class="mt-6">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3310.4506709291816!2d-118.24368372334842!3d34.05223427316938!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c2c76628539e7f%3A0x9f724655d28f931b!2sLos%20Angeles%2C%20CA!5e0!3m2!1sen!2sus!4v1680000000000!5m2!1sen!2sus" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" class="rounded-2xl"></iframe>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-black/70 backdrop-blur-lg py-4 px-6 text-center">
        <p>&copy; 2024 Nova Horizon. All rights reserved.</p>
    </footer>

</body>
</html>
