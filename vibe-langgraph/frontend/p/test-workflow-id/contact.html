<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Nova Horizon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary': '#0B0D17',
                        'secondary': '#E6E6FA',
                        'accent': '#9886A0',
                    },
                    fontFamily: {
                        'sans': ['Roboto', 'sans-serif'],
                        'display': ['Bebas Neue', 'sans-serif'],
                    },
                    spacing: {
                        'fluid': 'clamp(1rem, 5vw, 3rem)',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .kinetic-typography {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            animation: pulse 3s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body class="bg-primary font-sans text-secondary">

    <!-- Header -->
    <header class="bg-white/10 backdrop-blur-lg border border-white/20 py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-display text-white">Nova Horizon</a>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="index.html" class="hover:text-accent transition-colors duration-300">Home</a></li>
                    <li><a href="about.html" class="hover:text-accent transition-colors duration-300">About</a></li>
                    <li><a href="contact.html" class="text-accent">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Contact Section -->
    <section class="py-20">
        <div class="container mx-auto text-center">
            <h1 class="kinetic-typography mb-8">Contact Us</h1>
            <p class="text-lg mb-12">Reach out to learn more about our extraordinary journeys and how you can
                transcend the ordinary with Nova Horizon.</p>

            <div class="max-w-lg mx-auto bg-white/10 backdrop-blur-lg border border-white/20 rounded-2xl p-8">
                <form action="#" method="POST">
                    <div class="mb-4">
                        <label for="name" class="block text-left text-white text-sm font-bold mb-2">Name:</label>
                        <input type="text" id="name" name="name"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-accent"
                            placeholder="Your Name">
                    </div>
                    <div class="mb-4">
                        <label for="email" class="block text-left text-white text-sm font-bold mb-2">Email:</label>
                        <input type="email" id="email" name="email"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-accent"
                            placeholder="Your Email">
                    </div>
                    <div class="mb-6">
                        <label for="message" class="block text-left text-white text-sm font-bold mb-2">Message:</label>
                        <textarea id="message" name="message" rows="4"
                            class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 ring-accent"
                            placeholder="Your Message"></textarea>
                    </div>
                    <div class="flex items-center justify-between">
                        <button
                            class="bg-accent hover:bg-secondary text-primary font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline focus:ring-2 ring-primary transition-colors duration-300"
                            type="submit">
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-white/10 backdrop-blur-lg border border-white/20 py-8">
        <div class="container mx-auto text-center">
            <p class="text-sm">&copy; 2024 Nova Horizon. All rights reserved.</p>
        </div>
    </footer>

</body>

</html>
