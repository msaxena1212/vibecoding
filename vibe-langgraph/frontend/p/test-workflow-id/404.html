<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#E0F2FE',
                            100: '#CFE2FF',
                            200: '#A5D0FF',
                            300: '#7AC0FF',
                            400: '#50AEFF',
                            500: '#299CFF',
                            600: '#008AFF',
                            700: '#0078FF',
                            800: '#0066FF',
                            900: '#0054FF',
                        },
                        dark: '#121212',
                        light: '#FFFFFF',
                        accent: '#639fff',
                        error: '#ff6b6b',
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #FFFFFF;
        }
    </style>
</head>
<body class="bg-dark flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-5xl font-serif font-bold mb-4">Lost in Space?</h1>
        <p class="text-lg mb-8">Oops! The page you're looking for has drifted into the void. Return to Earth?</p>
        <a href="index.html" class="bg-accent hover:bg-primary-700 text-white font-bold py-2 px-4 rounded focus:ring-2 ring-primary">
            Return to Earth
        </a>
    </div>
</body>
</html>
