<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nova Horizon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        serif: ['Bebas Neue', 'serif'],
                    },
                    colors: {
                        primary: {
                            50: '#E6E6FA',
                            100: '#D4D4ED',
                            200: '#B2B1D6',
                            300: '#9886A0',
                            400: '#5A5266',
                            500: '#0B0D17',
                        },
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0B0D17;
            color: #E6E6FA;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-primary-500 h-screen flex items-center justify-center">
    <div class="text-center">
        <h1 class="text-6xl font-serif font-bold mb-4">404</h1>
        <p class="text-2xl mb-8">Oops! Looks like you've drifted off course.</p>
        <p class="text-lg mb-8">This page doesn't exist, or perhaps it's exploring a different galaxy.</p>
        <a href="index.html" class="inline-block bg-white text-primary-500 py-2 px-6 rounded-full font-bold hover:bg-primary-100 transition-colors duration-300">
            Return to Nova Horizon
        </a>
    </div>
</body>
</html>
