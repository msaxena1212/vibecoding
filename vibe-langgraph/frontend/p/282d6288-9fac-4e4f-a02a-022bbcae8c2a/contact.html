<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Pens & Pencils</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#333333',
                        secondary: '#f0f0f0',
                        accent: '#a68e6c',
                    },
                    fontFamily: {
                        sans: ['"Open Sans"', 'sans-serif'],
                        serif: ['"Lora"', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glassmorphism {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-secondary font-sans">

    <header class="glassmorphism p-4 mb-8 sticky top-0 z-10">
        <nav class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="text-xl font-semibold text-primary">Pens & Pencils</a>
            <div class="space-x-4">
                <a href="index.html" class="text-primary hover:text-accent transition-colors">Home</a>
                <a href="about.html" class="text-primary hover:text-accent transition-colors">About</a>
                <a href="contact.html" class="text-primary hover:text-accent transition-colors">Contact</a>
            </div>
        </nav>
    </header>

    <section class="container mx-auto p-6">
        <h1 class="text-3xl font-serif text-primary mb-4">Contact Us</h1>
        <p class="text-primary mb-6">We'd love to hear from you! Please use the form below to get in touch.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <form class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
                    <div class="mb-4">
                        <label class="block text-primary text-sm font-bold mb-2" for="name">
                            Name
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent" id="name" type="text" placeholder="Your Name">
                    </div>
                    <div class="mb-4">
                        <label class="block text-primary text-sm font-bold mb-2" for="email">
                            Email
                        </label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent" id="email" type="email" placeholder="Your Email">
                    </div>
                    <div class="mb-6">
                        <label class="block text-primary text-sm font-bold mb-2" for="message">
                            Message
                        </label>
                        <textarea class="shadow appearance-none border rounded w-full py-2 px-3 text-primary leading-tight focus:outline-none focus:shadow-outline focus:ring-2 focus:ring-accent" id="message" rows="5" placeholder="Your Message"></textarea>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-accent hover:bg-primary text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline transition-colors" type="submit">
                            Send
                        </button>
                    </div>
                </form>
            </div>

            <div>
                <h2 class="text-xl font-serif text-primary mb-2">Our Information</h2>
                <p class="text-primary mb-2">Email: <a href="mailto:info@pensandpencils.com" class="text-accent hover:text-primary transition-colors">info@pensandpencils.com</a></p>
                <p class="text-primary mb-2">Phone: (123) 456-7890</p>
                <p class="text-primary">Address: 123 Main Street, Anytown USA</p>
            </div>
        </div>
    </section>

</body>
</html>
