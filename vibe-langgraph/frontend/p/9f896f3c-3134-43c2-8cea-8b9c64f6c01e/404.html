<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
        body {
            background-color: #121212;
            color: #64FFDA;
            font-family: 'Space Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden; /* Hide scrollbars */
        }

        h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            margin-bottom: 0.5rem;
            text-shadow: 0 0 10px #64FFDA;
            animation: glitch 2s infinite;
        }

        p {
            font-size: clamp(1rem, 2vw, 1.5rem);
            margin-bottom: 2rem;
        }

        a {
            color: #F9F871;
            text-decoration: none;
            border: 1px solid #F9F871;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            transition: all 0.3s ease;
            display: inline-block; /* Ensure proper padding and margin */
        }

        a:hover {
            background-color: #F9F871;
            color: #121212;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-5px, 5px);
            }
            40% {
                transform: translate(5px, -5px);
            }
            60% {
                transform: translate(-5px, -5px);
            }
            80% {
                transform: translate(5px, 5px);
            }
            100% {
                transform: translate(0);
            }
        }

        .error-code {
            font-family: 'Roboto Mono', monospace;
            font-size: clamp(5rem, 12vw, 10rem);
            color: #F9F871;
            text-shadow: 0 0 5px #F9F871;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The digital realm can be a confusing place. It seems the page you're looking for has been lost in the matrix.</p>
    <a href="index.html">Return to the Main System</a>
</body>
</html>
