<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardian Angel</title>
    <link rel="icon" href="assets/app_icon.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            500: '#E0E7FF',
                            700: '#A5B4FC',
                        },
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        serif: ['Open Sans', 'serif'],
                    },
                    animation: {
                        'fade-in-up': 'fade-in-up 0.5s ease-out'
                    },
                    keyframes: {
                        'fade-in-up': {
                            '0%': {
                                opacity: '0',
                                transform: 'translateY(20px)'
                            },
                            '100%': {
                                opacity: '1',
                                transform: 'translateY(0)'
                            },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(to bottom, #E0E7FF, #A5B4FC);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-b from-primary-500 to-primary-700 text-white flex items-center justify-center">

<div class="container mx-auto px-4 py-16">
    <div class="text-center">
        <h1 class="text-4xl font-bold mb-4 animate-fade-in-up">
            Your Silent Guardian: Peace of Mind, Simplified
        </h1>
        <p class="text-lg mb-8 animate-fade-in-up">
            Live confidently, knowing help is just a check-in away. Simple daily check-ins ensure your well-being, automatically alerting your trusted contacts if needed.
        </p>
        <a href="#" class="bg-white text-primary-700 font-bold py-4 px-8 rounded-full text-xl shadow-lg hover:bg-primary-500 hover:text-white transition-colors duration-300 inline-block animate-fade-in-up">
            Check-In
        </a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
